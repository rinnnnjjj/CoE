<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Updates & Events — CBR/CBID Centre of Excellence for Asia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    /* Structure + text */
    --bg:#FBF8F2;
    --ink:#202B3D;
    --muted:rgba(32,43,61,0.62);
    --line:rgba(32,43,61,0.16);
    --card-bg:#FFFFFF;
    --focus:#5B67CA;
    --ink-wash:rgba(32,43,61,0.06);

    /* Accent hues — one per Area of Change, reserved for the Theme tag only */
    --coral:#EF6F53;
    --coral-wash:rgba(239,111,83,0.12);
    --accent-teal:#21A897;
    --accent-teal-wash:rgba(33,168,151,0.12);
    --amber:#F2A93B;
    --amber-wash:rgba(242,169,59,0.15);
    --indigo:#5B67CA;
    --indigo-wash:rgba(91,103,202,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5;
  }
  a{color:var(--ink);}
  a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{
    outline:3px solid var(--focus);
    outline-offset:2px;
  }
  .wrap{
    max-width:960px;
    margin:0 auto;
    padding:2.5rem 1.25rem 5rem;
  }
  header.masthead{
    border-bottom:2px solid var(--ink);
    padding-bottom:1.5rem;
    margin-bottom:1.75rem;
  }
  header.masthead h1{
    font-family:"Source Serif 4",Georgia,serif;
    font-weight:700;
    font-size:clamp(1.6rem,3.4vw,2.35rem);
    margin:0 0 .4rem;
    letter-spacing:-0.01em;
  }
  header.masthead p{
    margin:0;
    max-width:62ch;
    color:var(--muted);
    font-size:1rem;
  }

  .toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:.6rem;
    align-items:center;
    margin-bottom:1.5rem;
  }
  .toolbar input[type="search"]{
    flex:1 1 220px;
    padding:.55rem .7rem;
    border:1px solid var(--line);
    border-radius:3px;
    font-size:.95rem;
    background:var(--card-bg);
    color:var(--ink);
  }
  .toolbar select{
    padding:.55rem .6rem;
    border:1px solid var(--line);
    border-radius:3px;
    font-size:.9rem;
    background:var(--card-bg);
    color:var(--ink);
  }

  /* ---------- Primary tabs: by content type — a list that will keep growing,
     so it scales as an underline tab strip (scrolls sideways, never wraps
     into a heavy multi-row block of buttons) ---------- */
  .tabs-primary{
    display:flex;
    gap:1.5rem;
    border-bottom:1px solid var(--line);
    margin-bottom:1.25rem;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .tabs-primary::-webkit-scrollbar{display:none;}
  .tabs-primary button{
    font:inherit;
    font-size:1.02rem;
    font-weight:700;
    background:none;
    border:none;
    padding:.7rem .05rem .65rem;
    cursor:pointer;
    color:var(--muted);
    border-bottom:3px solid transparent;
    margin-bottom:-1px;
    white-space:nowrap;
    flex:0 0 auto;
  }
  .tabs-primary button[aria-selected="true"]{
    color:var(--ink);
    border-bottom-color:var(--ink);
  }
  .tabs-primary button:hover:not([aria-selected="true"]){
    color:var(--ink);
  }

  /* ---------- Secondary control: timing — always exactly two states,
     so it's a compact segmented toggle rather than a tab strip ---------- */
  .tabs{
    display:inline-flex;
    gap:.15rem;
    background:var(--ink-wash);
    border-radius:100px;
    padding:.25rem;
    margin-bottom:1.5rem;
  }
  .tabs button{
    font:inherit;
    font-size:.85rem;
    font-weight:700;
    background:none;
    border:none;
    border-radius:100px;
    padding:.45rem 1.05rem;
    cursor:pointer;
    color:var(--muted);
  }
  .tabs button[aria-selected="true"]{
    color:var(--bg);
    background:var(--ink);
  }
  .tabs.hidden{display:none;}

  ul.event-list{list-style:none;margin:0 -1rem;padding:0;}
  .event-row{
    display:flex;
    gap:1.25rem;
    padding:1.6rem 1rem;
    border-bottom:1px solid var(--line);
    align-items:flex-start;
    border-radius:10px;
  }
  .event-row:first-child{padding-top:1.1rem;}
  @media (prefers-reduced-motion:no-preference){
    .event-row{transition:background-color .15s ease;}
  }
  .event-row:hover{background:var(--ink-wash);}

  /* ---------- Date stamp (fixed-date items) ---------- */
  .datestamp{
    flex:0 0 68px;
    text-align:center;
    padding-top:.15rem;
  }
  .datestamp .month{
    font-size:.72rem;
    font-weight:700;
    letter-spacing:.04em;
    color:var(--ink);
  }
  .datestamp .day{
    font-family:"Source Serif 4",Georgia,serif;
    font-size:1.9rem;
    font-weight:700;
    line-height:1.05;
    color:var(--ink);
  }
  .datestamp .year{
    font-size:.72rem;
    color:var(--muted);
  }
  /* ---------- Date stamp (open-ended / deadline-only items) ---------- */
  .datestamp .badge-open{
    display:inline-block;
    font-size:.62rem;
    font-weight:700;
    letter-spacing:.03em;
    color:var(--bg);
    background:var(--ink);
    padding:.2rem .38rem;
    border-radius:3px;
    margin-bottom:.3rem;
  }
  .datestamp .deadline-till{
    font-size:.68rem;
    color:var(--muted);
    line-height:1.25;
  }
  .datestamp .deadline-till b{
    display:block;
    color:var(--ink);
    font-size:.78rem;
  }
  /* ---------- Date stamp (no date info at all — e.g. a report) ---------- */
  .datestamp .no-date-icon{
    display:flex;
    align-items:center;
    justify-content:center;
    width:34px;
    height:34px;
    margin:0 auto;
    border-radius:6px;
    background:var(--ink-wash);
    color:var(--muted);
  }

  .event-main{flex:1 1 auto; min-width:0;}
  .event-main h2{
    font-family:"Source Serif 4",Georgia,serif;
    font-size:1.15rem;
    font-weight:600;
    margin:0 0 .2rem;
    line-height:1.3;
  }
  .submitted-by{
    font-size:.8rem;
    color:var(--muted);
    font-weight:400;
    margin:0 0 .55rem;
  }

  /* ---------- Tags: informational metadata, pill-shaped, quiet ---------- */
  .tags{
    display:flex;
    flex-wrap:wrap;
    gap:.4rem;
    margin-bottom:.55rem;
  }
  .tag{
    font-size:.72rem;
    font-weight:600;
    padding:.2rem .55rem;
    border:1px solid var(--line);
    border-radius:100px;
    color:var(--muted);
    white-space:nowrap;
    background:transparent;
  }
  /* Type is conveyed by the primary tab already, so it stays neutral/structural */
  .tag.format{color:var(--muted);}

  /* Theme (Area of Change) is the one place color carries meaning */
  .tag.theme{font-weight:700;}
  .tag.theme.theme-coral{color:var(--coral);border-color:var(--coral);background:var(--coral-wash);}
  .tag.theme.theme-teal{color:var(--accent-teal);border-color:var(--accent-teal);background:var(--accent-teal-wash);}
  .tag.theme.theme-amber{color:var(--amber);border-color:var(--amber);background:var(--amber-wash);}
  .tag.theme.theme-indigo{color:var(--indigo);border-color:var(--indigo);background:var(--indigo-wash);}

  .event-main p.desc{
    margin:.3rem 0 .7rem;
    color:var(--ink);
    font-size:.95rem;
  }
  .event-meta-line{
    font-size:.85rem;
    color:var(--muted);
    margin:0 0 .6rem;
  }

  /* ---------- Action: one clear, real button — deliberately unlike a tag ---------- */
  .event-actions{
    margin-top:.85rem;
  }
  .btn{
    display:inline-flex;
    align-items:center;
    gap:.45rem;
    font:inherit;
    font-size:.85rem;
    font-weight:700;
    text-decoration:none;
    cursor:pointer;
    border-radius:6px;
    padding:.55rem 1.05rem;
    line-height:1.15;
    white-space:nowrap;
  }
  .btn svg{flex:0 0 auto;}
  .btn-primary{
    background:var(--ink);
    color:var(--bg);
    border:1.5px solid var(--ink);
  }
  .btn-primary:hover{opacity:.85;}
  .btn-primary:focus-visible{outline-color:var(--focus);}

  .poster-thumb{
    flex:0 0 104px;
  }
  .poster-thumb a{display:block;}
  .poster-thumb img{
    width:104px;
    height:104px;
    object-fit:cover;
    border:1px solid var(--line);
    border-radius:6px;
    display:block;
    transition:border-color .15s ease;
  }
  .poster-thumb a:hover img{border-color:var(--ink);}

  .empty-state{
    padding:2.5rem 0;
    color:var(--muted);
    font-size:.98rem;
    border-bottom:1px solid var(--line);
  }
  .status-line{
    font-size:.85rem;
    color:var(--muted);
    margin-bottom:1rem;
  }

  @media (max-width:560px){
    ul.event-list{margin:0 -.5rem;}
    .event-row{flex-wrap:wrap; padding:1.4rem .75rem;}
    .poster-thumb{order:3; flex:0 0 100%;}
    .poster-thumb img{width:100%; height:150px;}
    .datestamp{flex:0 0 56px;}
    .btn{width:100%; justify-content:center;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <h1>Updates & events across the network</h1>
    <p>Trainings, webinars, calls for papers and reports shared by members of the CBR/CBID Centre of Excellence for Asia.</p>
  </header>

  <div class="tabs-primary" role="tablist" aria-label="Content type" id="tabs-primary"></div>

  <div class="toolbar" role="search">
    <label for="q" class="visually-hidden" style="position:absolute;left:-9999px;">Search</label>
    <input type="search" id="q" placeholder="Search by title or keyword…">
    <select id="country"><option value="">All countries</option></select>
    <select id="theme"><option value="">All themes</option></select>
    <select id="format"><option value="">All formats</option></select>
  </div>

  <div class="tabs" role="tablist" aria-label="Timing" id="timing-tabs">
    <button role="tab" id="tab-upcoming" aria-selected="true" aria-controls="panel-events">Open / Upcoming</button>
    <button role="tab" id="tab-past" aria-selected="false" aria-controls="panel-events">Past / Closed</button>
  </div>

  <p class="status-line" id="status">Loading…</p>

  <div id="panel-events" role="tabpanel">
    <ul class="event-list" id="event-list"></ul>
  </div>

</div>

<script>
/* ============================================================
   1. PASTE YOUR PUBLISHED "Published" TAB CSV LINK BELOW
   (Step-by-step instructions are in the chat guide)

   2. This version expects a "Type" column in your sheet.
      Any text works and is shown/filterable as-is; these four
      get their own color: Event, Report, Call for Papers, Other.
      A blank Type cell is treated as "Other".

   3. "Start date" may be left BLANK for open-ended items
      (e.g. a call for papers open now with no fixed start).
      "End date" is then read as the closing/deadline date.

   4. Both "Start date" AND "End date" may be left BLANK
      (common for a report with no fixed timing) — it will
      show a plain type badge instead of a date, and stay
      under "Open / Upcoming" indefinitely since it never closes.
   ============================================================ */
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSkjOHDpnu8xyVNjGRQLNxE-fyWTvQH15NrBZorXD_hW7a0V7hAR5FSL0Xxz_5HonedYG91YQN-Utpj/pub?gid=479167724&single=true&output=csv";

const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

function parseFlexibleDate(str){
  if(!str) return null;
  str = String(str).trim();
  if(!str) return null;
  // ISO: 2026-10-15
  let m = str.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return new Date(+m[1], +m[2]-1, +m[3]);
  // US: 10/15/2026
  m = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m) return new Date(+m[3], +m[1]-1, +m[2]);
  const d = new Date(str);
  return isNaN(d) ? null : d;
}

function escapeHtml(s){
  return String(s || "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function typeClass(type){
  const t = (type || "").toLowerCase();
  if(t.includes("report")) return "type-report";
  if(t.includes("call")) return "type-cfp";
  if(t.includes("event")) return "type-event";
  return "type-other";
}

// Order and labels for the primary (content-type) tabs.
const CATEGORY_META = {
  "type-event":  { label: "Events" },
  "type-cfp":    { label: "Calls for Papers" },
  "type-report": { label: "Reports" },
  "type-other":  { label: "Other" }
};
const CATEGORY_ORDER = ["type-event","type-cfp","type-report","type-other"];

// Reports have no open/close window — the timing sub-tabs don't apply to them.
const CATEGORIES_WITHOUT_TIMING = ["type-report"];

// The 4 accent hues are reserved for Theme (Area of Change) tags only.
// Any theme text maps consistently to one of the 4 — same theme, same color,
// every time — without needing to hardcode each Area of Change by name.
const THEME_COLOR_CLASSES = ["theme-coral","theme-teal","theme-amber","theme-indigo"];
function themeColorClass(themeText){
  const s = (themeText || "").trim().toLowerCase();
  let hash = 0;
  for(let i=0; i<s.length; i++){ hash = (hash * 31 + s.charCodeAt(i)) >>> 0; }
  return THEME_COLOR_CLASSES[hash % THEME_COLOR_CLASSES.length];
}

function fieldsFromRow(row){
  return {
    type: (row["Type"] || "").trim() || "Other",
    title: row["Event title"] || "",
    start: parseFlexibleDate(row["Start date"]),
    end: parseFlexibleDate(row["End date"]),
    time: row["Time + timezone"] || "",
    format: row["Format"] || "",
    location: row["Location / registration link"] || "",
    country: row["Country"] || "",
    description: row["Description"] || "",
    theme: row["Theme"] || "",
    language: row["Event language"] || "",
    poster: row["Poster link"] || "",
    posterAlt: row["Poster alt text"] || "",
    submitter: row["Submitter name"] || "",
    org: row["Submitter organization"] || ""
  };
}

function rowIsPoster(url){
  return url && /^https?:\/\//i.test(url);
}

let ALL_EVENTS = [];
let activeTab = "upcoming";
let activeCategory = null;

function populateFilterOptions(events){
  const countries = [...new Set(events.map(e=>e.country).filter(Boolean))].sort();
  const themes = [...new Set(events.map(e=>e.theme).filter(Boolean))].sort();
  const formats = [...new Set(events.map(e=>e.format).filter(Boolean))].sort();

  const fill = (sel, values) => {
    sel.querySelectorAll("option:not(:first-child)").forEach(o=>o.remove());
    values.forEach(v=>{
      const opt = document.createElement("option");
      opt.value = v; opt.textContent = v;
      sel.appendChild(opt);
    });
  };
  fill(document.getElementById("country"), countries);
  fill(document.getElementById("theme"), themes);
  fill(document.getElementById("format"), formats);
}

function populateCategoryTabs(events){
  const present = new Set(events.map(e => typeClass(e.type)));
  const categories = CATEGORY_ORDER.filter(c => present.has(c));

  if(!activeCategory || !present.has(activeCategory)){
    activeCategory = categories[0] || "type-event";
  }

  const container = document.getElementById("tabs-primary");
  container.innerHTML = "";
  categories.forEach(cat=>{
    const btn = document.createElement("button");
    btn.type = "button";
    btn.role = "tab";
    btn.setAttribute("aria-selected", cat === activeCategory ? "true" : "false");
    btn.textContent = (CATEGORY_META[cat] && CATEGORY_META[cat].label) || cat;
    btn.addEventListener("click", ()=>{
      activeCategory = cat;
      container.querySelectorAll("button").forEach(b=>b.setAttribute("aria-selected","false"));
      btn.setAttribute("aria-selected","true");
      updateTimingTabsVisibility();
      render();
    });
    container.appendChild(btn);
  });

  updateTimingTabsVisibility();
}

function updateTimingTabsVisibility(){
  const timingTabs = document.getElementById("timing-tabs");
  timingTabs.classList.toggle("hidden", CATEGORIES_WITHOUT_TIMING.includes(activeCategory));
}

function currentFilters(){
  return {
    q: document.getElementById("q").value.trim().toLowerCase(),
    country: document.getElementById("country").value,
    theme: document.getElementById("theme").value,
    format: document.getElementById("format").value
  };
}

function render(){
  const list = document.getElementById("event-list");
  const status = document.getElementById("status");
  const f = currentFilters();
  const today = new Date(); today.setHours(0,0,0,0);

  let events = ALL_EVENTS.filter(e=>{
    if(typeClass(e.type) !== activeCategory) return false;
    if(f.q && !(e.title.toLowerCase().includes(f.q) || e.description.toLowerCase().includes(f.q))) return false;
    if(f.country && e.country !== f.country) return false;
    if(f.theme && e.theme !== f.theme) return false;
    if(f.format && e.format !== f.format) return false;
    return true;
  });

  const timingApplies = !CATEGORIES_WITHOUT_TIMING.includes(activeCategory);

  if(!timingApplies){
    // Reports have no open/close window — show everything, newest first.
    events = events.sort((a,b)=> (b.start||b.end||0) - (a.start||a.end||0));
  } else if(activeTab === "upcoming"){
    // Open/Upcoming: no end date at all, OR end date is today or later.
    events = events.filter(e => !e.end || e.end >= today)
      .sort((a,b)=> (a.start||a.end||0) - (b.start||b.end||0));
  } else {
    events = events.filter(e => e.end && e.end < today)
      .sort((a,b)=> (b.start||b.end||0) - (a.start||a.end||0));
  }

  const categoryLabel = (CATEGORY_META[activeCategory] && CATEGORY_META[activeCategory].label) || "items";

  // When there's nothing to show, the empty-state message below says so —
  // no need for the status line to also announce it and repeat itself.
  status.textContent = events.length
    ? `${events.length} item${events.length===1?"":"s"}`
    : "";

  list.innerHTML = "";
  if(events.length === 0){
    const li = document.createElement("li");
    li.className = "empty-state";
    li.textContent = !timingApplies
      ? `No ${categoryLabel.toLowerCase()} match these filters.`
      : activeTab === "upcoming"
        ? `No open or upcoming ${categoryLabel.toLowerCase()} yet. Check back soon, or adjust the filters above.`
        : `No past or closed ${categoryLabel.toLowerCase()} match these filters.`;
    list.appendChild(li);
    return;
  }

  events.forEach(e=>{
    const li = document.createElement("li");
    li.className = "event-row";

    let dateStampHtml;
    if(e.start){
      dateStampHtml = `
        <div class="month">${MONTHS[e.start.getMonth()]}</div>
        <div class="day">${e.start.getDate()}</div>
        <div class="year">${e.start.getFullYear()}</div>`;
    } else if(e.end){
      dateStampHtml = `
        <div class="badge-open">OPEN NOW</div>
        <div class="deadline-till">until<br><b>${MONTHS[e.end.getMonth()]} ${e.end.getDate()}, ${e.end.getFullYear()}</b></div>`;
    } else {
      // No dates at all — common for a report with no fixed timing.
      // The active tab already says what type this is, so just a quiet icon here.
      dateStampHtml = `<div class="no-date-icon" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 1.5h6l2.5 2.5v10a1 1 0 0 1-1 1h-7.5a1 1 0 0 1-1-1v-11a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M10 1.5V4a1 1 0 0 0 1 1h2.5" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
      </div>`;
    }

    const posterHtml = rowIsPoster(e.poster)
      ? `<div class="poster-thumb"><a href="${escapeHtml(e.poster)}" target="_blank" rel="noopener">
           <img src="${escapeHtml(e.poster)}" alt="${escapeHtml(e.posterAlt || e.title + ' poster')}" loading="lazy">
         </a></div>`
      : "";

    const registerHtml = /^https?:\/\//i.test(e.location)
      ? `<a class="btn btn-primary" href="${escapeHtml(e.location)}" target="_blank" rel="noopener">
           Details
           <svg width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3h7v7M13 3 3 13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
         </a>`
      : "";

    li.innerHTML = `
      <div class="datestamp">${dateStampHtml}</div>
      <div class="event-main">
        <h2>${escapeHtml(e.title)}</h2>
        ${e.org ? `<p class="submitted-by">Submitted by ${escapeHtml(e.org)}</p>` : ""}
        <div class="tags">
          ${activeCategory === "type-other" ? `<span class="tag ${typeClass(e.type)}">${escapeHtml(e.type)}</span>` : ""}
          ${e.format ? `<span class="tag format">${escapeHtml(e.format)}</span>` : ""}
          ${e.theme ? `<span class="tag theme ${themeColorClass(e.theme)}">${escapeHtml(e.theme)}</span>` : ""}
          ${e.country ? `<span class="tag">${escapeHtml(e.country)}</span>` : ""}
        </div>
        <p class="event-meta-line">
          ${e.time ? escapeHtml(e.time) : ""}${e.time && !/^https?:\/\//i.test(e.location) && e.location ? " · " : ""}${!/^https?:\/\//i.test(e.location) ? escapeHtml(e.location) : ""}
        </p>
        <p class="desc">${escapeHtml(e.description)}</p>
        ${registerHtml ? `<div class="event-actions">${registerHtml}</div>` : ""}
      </div>
      ${posterHtml}
    `;
    list.appendChild(li);
  });
}

function wireControls(){
  ["q","country","theme","format"].forEach(id=>{
    document.getElementById(id).addEventListener("input", render);
    document.getElementById(id).addEventListener("change", render);
  });
  const tabUp = document.getElementById("tab-upcoming");
  const tabPast = document.getElementById("tab-past");
  tabUp.addEventListener("click", ()=>{
    activeTab="upcoming"; tabUp.setAttribute("aria-selected","true"); tabPast.setAttribute("aria-selected","false"); render();
  });
  tabPast.addEventListener("click", ()=>{
    activeTab="past"; tabPast.setAttribute("aria-selected","true"); tabUp.setAttribute("aria-selected","false"); render();
  });
}

function loadEvents(){
  const status = document.getElementById("status");

  if(!CSV_URL || CSV_URL.indexOf("PASTE_YOUR") === 0){
    status.textContent = "Setup needed: paste your published-sheet CSV link into CSV_URL in the code.";
    return;
  }

  Papa.parse(CSV_URL, {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: function(results){
      const rows = results.data.filter(r => (r["Event title"] || "").trim() !== "");
      ALL_EVENTS = rows.map(fieldsFromRow);
      populateFilterOptions(ALL_EVENTS);
      populateCategoryTabs(ALL_EVENTS);
      render();
    },
    error: function(err){
      status.textContent = "Could not load the events sheet. Check the CSV link and that the sheet is published to the web.";
      console.error(err);
    }
  });
}

wireControls();
loadEvents();
</script>
</body>
</html>
